name: Deploy to Hostinger

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      HOSTINGER_DEPLOY: 'true'
    steps:
      - name: Check out main
        uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build root-domain site
        run: npm run build

      - name: Validate Hostinger output
        run: |
          test -f dist/index.html
          test -f dist/catalogo/index.html
          test -f dist/franquicias/index.html
          test -f dist/catalogo/aranita/index.html
          test -f dist/catalogo/corte-americano/index.html
          test -f dist/products-detail/aranita.webp
          test -f dist/products-detail/corte-americano.webp
          set +e
          grep -R -n -F -- '/cortes/' dist
          grep_status=$?
          set -e
          if [ "$grep_status" -eq 0 ]; then
            echo '::error::Hostinger build contains GitHub Pages base paths'
            exit 1
          elif [ "$grep_status" -ne 1 ]; then
            echo '::error::Hostinger build validation could not scan dist'
            exit "$grep_status"
          fi

      - name: Upload dist to Hostinger
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.HOSTINGER_FTP_SERVER }}
          username: ${{ secrets.HOSTINGER_FTP_USERNAME }}
          password: ${{ secrets.HOSTINGER_FTP_PASSWORD }}
          protocol: ftp
          port: 21
          local-dir: ./dist/
          server-dir: ./
          dangerous-clean-slate: false
