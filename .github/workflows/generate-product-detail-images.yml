name: Generate product detail images

on:
  workflow_dispatch:

jobs:
  upscale:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install CPU inference dependencies
        run: |
          python -m venv .venv
          source .venv/bin/activate
          python -m pip install --upgrade pip
          python -m pip install "setuptools<81" wheel "numpy==1.26.4"
          python -m pip install torch==2.2.2+cpu torchvision==0.17.2+cpu --index-url https://download.pytorch.org/whl/cpu
          python -m pip install opencv-python==4.10.0.84 Pillow tqdm huggingface-hub==0.25.2
          python -m pip install --no-deps --no-build-isolation git+https://github.com/ai-forever/Real-ESRGAN.git@362a0316878f41dbdfbb23657b450c3353de5acf
      - name: Generate all catalog detail images
        run: |
          source .venv/bin/activate
          python scripts/generate_product_detail_images.py
      - name: Validate output
        run: |
          test "$(find products-detail-output -name '*.webp' | wc -l)" -eq 33
          python -m json.tool products-detail-output/report.json >/dev/null
      - uses: actions/upload-artifact@v4
        with:
          name: realesrgan-product-detail-images
          path: products-detail-output/
