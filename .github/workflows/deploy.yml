name: Build and publish

# Hostinger's Git integration clones a branch and serves it — it does not run a
# build. So this workflow builds the site and force-pushes the *contents* of
# dist/ to a `deploy` branch, which is what Hostinger is pointed at.
#
# `deploy` is machine-owned: it is rewritten from scratch on every run.
# Never commit to it by hand — anything you push there will be discarded.

on:
  push:
    branches: [main]
  workflow_dispatch:

# Only the built-in GITHUB_TOKEN is used, scoped to this repository.
permissions:
  contents: write

# A newer build always wins; don't race two deploys onto the same branch.
concurrency:
  group: publish-deploy
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out main
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Runs `astro check` first, then builds. Fails on a type error, a
      # duplicate product slug, an unknown category or a missing image.
      - name: Build
        run: npm run build

      - name: Sanity-check the output
        run: |
          test -f dist/index.html          || { echo "::error::dist/index.html missing"; exit 1; }
          test -f dist/.htaccess           || { echo "::error::dist/.htaccess missing"; exit 1; }
          test -f dist/404.html            || { echo "::error::dist/404.html missing"; exit 1; }
          test -f dist/robots.txt          || { echo "::error::dist/robots.txt missing"; exit 1; }
          test -f dist/sitemap-index.xml   || { echo "::error::sitemap missing"; exit 1; }
          pages=$(find dist -name '*.html' | wc -l)
          products=$(find dist/catalogo -mindepth 1 -maxdepth 1 -type d | wc -l)
          echo "pages: $pages, product routes: $products"
          [ "$products" -eq 33 ] || { echo "::error::expected 33 product routes, found $products"; exit 1; }

      - name: Publish dist/ to the deploy branch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd dist
          git init -q
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -q -b deploy
          git add -A                       # -A picks up .htaccess and other dotfiles
          git commit -q -m "Build ${GITHUB_SHA::7} — $(date -u +%Y-%m-%dT%H:%MZ)"
          git push -q --force \
            "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" deploy
          echo "Published $(git ls-files | wc -l) files to the deploy branch."
