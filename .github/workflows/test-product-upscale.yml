name: Test product super-resolution

on:
  workflow_dispatch:

jobs:
  upscale:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install CPU inference dependencies
        run: |
          python -m venv .venv
          source .venv/bin/activate
          python -m pip install --upgrade pip
          python -m pip install "setuptools<81" wheel
          python -m pip install "numpy==1.26.4"
          python -m pip install torch==2.2.2+cpu torchvision==0.17.2+cpu --index-url https://download.pytorch.org/whl/cpu
          python -m pip install opencv-python==4.10.0.84 Pillow tqdm huggingface-hub
          python -m pip install --no-deps --no-build-isolation git+https://github.com/ai-forever/Real-ESRGAN.git@362a0316878f41dbdfbb23657b450c3353de5acf
      - name: Verify CPU inference environment
        run: |
          source .venv/bin/activate
          python - <<'PY'
          import numpy
          import torch
          import torchvision
          from RealESRGAN import RealESRGAN
          print("numpy", numpy.__version__)
          print("torch", torch.__version__)
          print("torchvision", torchvision.__version__)
          print("RealESRGAN import OK")
          print("CUDA available:", torch.cuda.is_available())
          PY
      - name: Upscale three catalog products
        run: |
          source .venv/bin/activate
          python scripts/test_product_upscale.py
      - name: Validate output
        run: |
          test -f upscale-test/corte-americano.png
          test -f upscale-test/aranita.png
          test -f upscale-test/tomahawk.png
          python -m json.tool upscale-test/report.json >/dev/null
      - uses: actions/upload-artifact@v4
        with:
          name: realesrgan-product-test
          path: upscale-test/
