name: Test product super-resolution

on:
  workflow_dispatch:

jobs:
  upscale:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install CPU inference dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch==2.2.2 torchvision==0.17.2
          python -m pip install git+https://github.com/ai-forever/Real-ESRGAN.git@main
      - name: Upscale three catalog products
        run: python scripts/test_product_upscale.py
      - name: Validate output
        run: |
          test -f upscale-test/corte-americano.png
          test -f upscale-test/aranita.png
          test -f upscale-test/tomahawk.png
          python -m json.tool upscale-test/report.json >/dev/null
      - uses: actions/upload-artifact@v4
        with:
          name: realesrgan-product-test
          path: upscale-test/
